[project]
name = "pypension"
version = "0.1.0"
description = "Backtest pension investments"
readme = "README.md"
authors = [
    { name = "bollard", email = "358225+bollard@users.noreply.github.com" }
]
license = "LicenseRef-Proprietary"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">= 3.13"
dependencies = [
    "matplotlib >= 3.11.1",
    "numpy >= 2.5.1",
    "pandas >= 3.0.5",
    "scipy >= 1.18.0",
    "seaborn >= 0.13.2",
    "yfinance >= 1.5.2",
]

[dependency-groups]
dev = [
    "pandas-stubs >= 3.0.3",
    "pre-commit >= 4.6.1",
    "ruff >= 0.15.21",
    "scipy-stubs >= 1.18.0",
]

[build-system]
requires = ["uv_build >= 0.11.6, < 0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pypension"
module-root = "src"

[tool.ruff]
target-version = "py313"
extend-include = ["*.ipynb"]
extend-exclude = ["*.png"]

[tool.ruff.lint]
extend-select = ["I"] # isort
