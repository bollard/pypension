[project]
name = "pypension"
version = "0.1.0"
description = "Backtest pension investments"
readme = "README.md"
authors = [
    { name = "bollard", email = "358225+bollard@users.noreply.github.com" }
]
license = "LicenseRef-Proprietary"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">= 3.13"
dependencies = [
    "matplotlib >= 3.11.2",
    "numpy >= 2.5.4",
    "pandas >= 3.1.0",
    "scipy >= 1.18.1",
    "seaborn >= 0.13.2",
    "yfinance >= 1.7.0",
]

[dependency-groups]
dev = [
    "pandas-stubs >= 3.0.5",
    "pre-commit >= 4.7.0",
    "ruff >= 0.17.2",
    "scipy-stubs >= 1.18.1",
]
test = [
    "pytest >= 9.1.1",
    "pytest-env >= 1.8.1",
]

[build-system]
requires = ["uv_build >= 0.13.0, < 0.14"]
build-backend = "uv_build"

[tool.uv]
system-certs = true

[tool.uv.build-backend]
module-name = "pypension"
module-root = "src"

[tool.pytest_env]
env_files = [".env.test"]
env_files_skip_if_set = true

[tool.ruff]
target-version = "py313"
extend-include = ["*.ipynb"]
extend-exclude = ["*.png"]

[tool.ruff.lint]
extend-select = ["I"] # isort
