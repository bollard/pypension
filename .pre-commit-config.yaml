repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: poetry run ruff check --fix
        language: system
        stages: [pre-commit]
        exclude: (.pre-commit-config.yaml|.gitignore|README.md|.run)
      - id: ruff-format
        name: Ruff format
        entry: poetry run ruff format
        language: system
        stages: [pre-commit]
        exclude: (.pre-commit-config.yaml|.gitignore|README.md|.run)
